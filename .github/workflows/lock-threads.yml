# ===== 1. スレッドの自動ロック =====
# クローズ / マージから30日経った Issue / PR を自動でロックする。
name: Lock Threads
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: 30
          pr-inactive-days: 30
