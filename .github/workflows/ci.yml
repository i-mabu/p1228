# ===== 1. ワークフロー全体設定 =====
name: p1228 CI

# push は main のみに絞り、PRブランチの push と pull_request による二重起動を防ぐ。
# ドキュメントのみの変更では起動しない。
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 2. Goジョブ =====
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
          cache-dependency-path: gateway/go.mod
      - name: Go formatting
        working-directory: gateway
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - name: Go module tidy check
        working-directory: gateway
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go vet
        working-directory: gateway
        run: go vet ./...
      - name: Go tests (race, shuffle, coverage)
        working-directory: gateway
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Coverage summary
        working-directory: gateway
        run: go tool cover -func=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.sha }}
          path: gateway/coverage.out
          if-no-files-found: error
          retention-days: 7
      - name: Vulnerability scan (govulncheck, non-blocking)
        working-directory: gateway
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Package source archive
        if: success()
        run: git archive --format=zip --prefix=p1228/ HEAD -o p1228-source.zip
      - name: Upload source archive
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: p1228-source-${{ github.sha }}
          path: p1228-source.zip
          if-no-files-found: error
          retention-days: 7

  # ===== 3. Workersジョブ =====
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Install native voice prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus-dev
      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --no-audit --no-fund
      - name: Prettier check
        working-directory: workers
        run: npm run format:check
      - name: Type check
        working-directory: workers
        run: npm run typecheck
      - name: Worker tests
        working-directory: workers
        run: npm test
      - name: TypeScript build
        working-directory: workers
        run: npm run build
      - name: Dependency audit (non-blocking)
        working-directory: workers
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Upload Worker dist
        uses: actions/upload-artifact@v7
        with:
          name: workers-dist-${{ github.sha }}
          path: workers/dist
          if-no-files-found: error
          retention-days: 7

  # ===== 4. Shellジョブ =====
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -sSfL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
      - name: Shell syntax
        run: bash -n deploy/install-ubuntu.sh deploy/scripts/*.sh scripts/format.sh .githooks/pre-commit
      - name: ShellCheck
        run: shellcheck deploy/install-ubuntu.sh deploy/scripts/*.sh scripts/format.sh .githooks/pre-commit
      - name: Shell formatting (shfmt)
        run: shfmt -i 2 -ci -d deploy/install-ubuntu.sh deploy/scripts/*.sh scripts/format.sh .githooks/pre-commit

  # ===== 5. PowerShellジョブ =====
  powershell-syntax:
    # pwsh は Linux ランナーにも標準搭載されており、構文検証・静的解析・整形確認は
    # OS に依存しない。Windows ランナーの2倍換算を避けるため ubuntu で実行する。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem -Path deploy/windows, scripts -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseFailures += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: PSScriptAnalyzer (Error blocks, Warning reports)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Get-ChildItem -Path deploy/windows, scripts -Filter '*.ps1' -File -Recurse |
            Invoke-ScriptAnalyzer -Severity Error, Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          }
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer reported $($errors.Count) error(s)."
            exit 1
          }
      - name: PowerShell formatting check (report only)
        shell: pwsh
        run: |
          Get-ChildItem -Path deploy/windows, scripts -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $original = Get-Content -LiteralPath $_.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $original
            if ($formatted -ne $original) {
              Write-Warning "Formatting differs from Invoke-Formatter output: $($_.FullName). Run scripts/format.ps1 locally to normalize."
            }
          }
