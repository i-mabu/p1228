# ===== 1. Release Drafter の設定 =====
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 新機能'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 バグ修正'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '⬆️ 依存関係の更新'
    labels:
      - 'dependencies'
  - title: '🧰 その他の変更'
    labels:
      - 'chore'
      - 'documentation'
change-template: '- $TITLE #$NUMBER (@$AUTHOR)'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'dependencies'
  default: patch
template: |
  ## 📝 変更内容

  $CHANGES
